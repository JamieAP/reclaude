[project]
name = "reclaude"
version = "1.0.0"
description = "Record and replay semantic events from Claude Code sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jamie" }]
keywords = ["claude", "ai", "logging", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]

dependencies = [
    "google-genai>=1.0.0",
    "structlog>=24.0.0",
    "sqlite-vec>=0.1.1",
    "zstandard>=0.23.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]

[project.scripts]
reclaude = "reclaude.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reclaude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
